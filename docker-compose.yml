# Local demo stack. Run `bash scripts/init-env.sh` (or scripts/init-env.ps1) first; every secret comes from .env.
#
#   docker compose up -d --build                                  api + postgres + redis + payment simulator
#   docker compose --profile messaging up -d                      + RabbitMQ and the notification worker (MESSAGING_PROVIDER=RabbitMq)
#   docker compose --profile observability up -d                  + Jaeger traces and Seq logs
name: walletflow

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: walletflow
      POSTGRES_USER: walletflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # loopback only; remove if you do not need host access
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U walletflow -d walletflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Idempotency keys, distributed rate-limit counters and the worker inbox. noeviction: never silently drop keys.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  payment-simulator:
    <<: *hardened
    build:
      context: .
      dockerfile: src/PaymentProvider.Simulator/Dockerfile
    environment:
      Simulator__ApiKey: ${PAYMENT_PROVIDER_API_KEY:?set PAYMENT_PROVIDER_API_KEY in .env}
      Simulator__FailureRate: "0.1"

  api:
    <<: *hardened
    build:
      context: .
      dockerfile: src/WalletFlow.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      payment-simulator:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Database=walletflow;Username=walletflow;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD}
      Idempotency__Provider: ${IDEMPOTENCY_PROVIDER:-Redis}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}
      PaymentProvider__BaseUrl: http://payment-simulator:8081
      PaymentProvider__ApiKey: ${PAYMENT_PROVIDER_API_KEY}
      Database__MigrateOnStartup: "true"
      Swagger__Enabled: "true"
      Seed__Enabled: ${SEED_ENABLED:-false}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-}
      Seed__AuditorPassword: ${SEED_AUDITOR_PASSWORD:-}
      Seed__DemoPassword: ${SEED_DEMO_PASSWORD:-}
      Seq__Url: ${SEQ_URL:-}
      Otel__Endpoint: ${OTEL_ENDPOINT:-}
      Otel__ExportMetrics: ${OTEL_EXPORT_METRICS:-false}
      Messaging__Provider: ${MESSAGING_PROVIDER:-Log}
      Messaging__RabbitMq__Host: rabbitmq
      Messaging__RabbitMq__Username: walletflow
      Messaging__RabbitMq__Password: ${RABBITMQ_PASSWORD:-}
    ports:
      - "127.0.0.1:8080:8080"

  # ---- optional: --profile messaging (RabbitMQ) ------------------------------------------------------------------
  rabbitmq:
    profiles: [messaging]
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: walletflow
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Consumes the outbox events published to RabbitMQ and sends (logs) notifications.
  notification-worker:
    <<: *hardened
    profiles: [messaging]
    build:
      context: .
      dockerfile: src/Notification.Worker/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      Redis__ConnectionString: redis:6379,password=${REDIS_PASSWORD}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: walletflow
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-}

  # ---- optional: --profile observability ---------------------------------------------------------------------------
  seq:
    profiles: [observability]
    image: datalust/seq:2024.3
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "127.0.0.1:5341:80"

  jaeger:
    profiles: [observability]
    image: jaegertracing/all-in-one:1.62.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"

volumes:
  pgdata:
  redisdata:
